  <title>👑 CASHPOR UNIT - 2 MASTER DASHBOARD SUITE</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- Core Data Libraries (SheetJS, PapaParse, Chart.js, Datalabels) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* ==========================================================================
        CASHPOR UNIT - 2 / LIGHT THEME GLOBALS (INDEX-2 STYLING)
        ========================================================================== */
    body {
      background-color: #e2e8f0;
      color: #1e293b;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header-bg {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    /* 3D Card Effect */
    .card-3d { 
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      border-radius: 16px; 
      padding: 24px; 
      box-shadow: 8px 8px 16px #cbd5e1, -8px -8px 16px #ffffff;
      border: 1px solid #e2e8f0;
      border-bottom: 5px solid #cbd5e1;
      border-right: 2px solid #cbd5e1;
      transition: transform 0.2s ease;
    }
    .card-3d:hover {
      transform: translateY(-2px);
    }

    /* 3D Button (Orange Gradient from Index-2) */
    .btn-3d {
      background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
      border-bottom: 4px solid #c2410c;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.1s;
    }
    .btn-3d:active {
      border-bottom: 0px solid #c2410c;
      transform: translateY(4px);
    }

    .text-3d {
      text-shadow: 3px 3px 0px #cbd5e1, 6px 6px 0px #94a3b8, 10px 10px 25px rgba(0,0,0,0.25);
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* ==========================================================================
        TOP NAVIGATION BAR (M-Swasth Styled)
        ========================================================================== */
    .royal-navbar {
      position: sticky;
      top: 0;
      z-index: 9999;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
      border-bottom: 6px solid #0f172a;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .royal-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .royal-logo-bubble {
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.3);
      overflow: hidden;
      height: 52px;
      width: 52px;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .royal-title-group h1 {
      font-family: 'Cinzel', serif;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .clock-badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-return-home {
      background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
      color: #ffffff;
      border: 1px solid #f97316;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
      text-transform: uppercase;
    }
    .btn-return-home:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }

    /* ==========================================================================
        SECTION: MASTER 3D PORTAL HUB
        ========================================================================== */
    #masterPortalHub {
      max-width: 1720px;
      margin: 0 auto;
      padding: 30px 24px 60px 24px;
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .portal-hero {
      text-align: center;
      margin-top: 50px;
      margin-bottom: 70px;
      position: relative;
    }

    /* 3D CARDS GRID */
    .portal-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 28px;
      margin-top: 30px;
      margin-bottom: 40px;
    }

    .portal-card-3d { 
      background: linear-gradient(145deg, #ffffff, #f1f5f9);
      border-radius: 16px; 
      padding: 32px 28px; 
      box-shadow: 8px 8px 16px #cbd5e1, -8px -8px 16px #ffffff;
      border: 1px solid #e2e8f0;
      border-bottom: 5px solid #cbd5e1;
      border-right: 2px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 280px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .portal-card-3d:hover {
      transform: translateY(-4px);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .card-badge {
      background: #e0f2fe;
      border: 1px solid #7dd3fc;
      color: #0369a1;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .card-icon-bubble {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: #ffffff;
      border: 2px solid #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #1e3a8a;
      box-shadow: inset 2px 2px 5px #cbd5e1;
    }

    .card-body h3 {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 24px;
      letter-spacing: 0.5px;
      line-height: 1.3;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Orange Gradient Button for Cards matching index-2 style */
    .btn-upload-direct {
      background: linear-gradient(135deg, #ea580c 0%, #f59e0b 100%);
      border-bottom: 4px solid #c2410c;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.1s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-transform: uppercase;
    }

    .btn-upload-direct:active {
      border-bottom: 0px solid #c2410c;
      transform: translateY(4px);
    }

    /* ==========================================================================
        DASHBOARDS CONTAINER & HEADER WRAPPERS
        ========================================================================== */
    .dashboard-view-container {
      display: none;
      max-width: 1840px;
      margin: 0 auto;
      padding: 24px;
      animation: fadeIn 0.35s ease-out;
    }

    .dashboard-view-container.active-view {
      display: block;
    }

    .view-control-bar {
      display: none;
    }

    .btn-back-hub {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
      color: #ffffff;
      border: 1px solid #60a5fa;
      padding: 9px 20px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
      transition: all 0.2s ease;
    }

    .btn-back-hub:hover {
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      transform: translateY(-2px);
    }
  </style>
</head>
